<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Артикуляційна гімнастика</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #dff6ff;
      font-family: "Comic Sans MS", sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    h1 {
      margin: 10px 0 5px;
      color: #2c6e91;
      font-size: clamp(20px, 3vw, 36px);
      text-align: center;
    }

    .counter {
      font-size: clamp(14px, 2vw, 20px);
      color: #333;
      margin-bottom: 5px;
      text-align: center;
    }

    #game-wrapper {
      flex: 1;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      box-sizing: border-box;
      overflow: hidden;
    }

    #learning-game {
      display: grid;
      gap: 8px;
      justify-content: center;
      align-content: center;
      width: 100%;
      height: 100%;
      background: url('background.jpg') center/cover no-repeat;
      transition: all 0.3s ease;
      padding: 10px;
      box-sizing: border-box;
    }

    .card {
      position: relative;
      aspect-ratio: 1 / 1;
      border-radius: 10px;
      overflow: hidden;
      background: #fff;
      cursor: pointer;
      transition: transform 0.3s ease, z-index 0.3s ease;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
      display: flex;
      align-items: center;
      justify-content: center;
    }

.svg-icon svg {
  height: 80%;
  width: auto;
  max-width: 80%;
  max-height: 80%;
  display: block;
}

.card .svg-icon {
  display: none;
  align-items: center;
  justify-content: center;
  width: 100%;
  height: 100%;
}

.card.open .svg-icon {
  display: flex;
  animation: zoomIn 0.3s ease;
}


    .card.open .svg-icon svg {
      display: block;
      animation: zoomIn 0.3s ease;
    }

    .cover {
      background: url('https://i.gifer.com/ODkr.gif') center/cover no-repeat, #9acd32;
      position: absolute;
      inset: 0;
      transition: opacity 0.3s ease;
    }

    .card.open .cover {
      opacity: 0;
    }

    .card.done {
      opacity: 0.7;
      filter: grayscale(60%);
    }

    .card.active {
      transform: scale(2);
      z-index: 1000;
    }

    @keyframes zoomIn {
      from { transform: scale(0.8); opacity: 0.5; }
      to { transform: scale(1); opacity: 1; }
    }

    button#restart {
      margin: 6px auto 10px;
      padding: 10px 20px;
      font-size: clamp(14px, 2vw, 18px);
      background-color: #2c6e91;
      color: #fff;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.3s;
    }

    button#restart:hover {
      background-color: #3a89b4;
    }
  </style>
</head>

    function createGame() {
      container.innerHTML = "";
      openedCount = 0;
      countEl.textContent = openedCount;

      const svgArray = Array.from({ length: totalCards }, (_, i) => svgs[i % svgs.length]);
      svgArray.sort(() => Math.random() - 0.5);

      svgArray.forEach((svgMarkup, i) => {
        const card = document.createElement("div");
        card.classList.add("card");
        card.dataset.state = "closed";

        const cover = document.createElement("div");
        cover.classList.add("cover");

        const svgContainer = document.createElement("div");
        svgContainer.classList.add("svg-icon");
        svgContainer.innerHTML = svgMarkup;

        card.appendChild(svgContainer);
        card.appendChild(cover);

        card.addEventListener("click", () => {
          const activeCard = document.querySelector(".card.active");
          if (activeCard && activeCard !== card) activeCard.classList.remove("active");

          if (card.dataset.state === "closed") {
            card.classList.add("open", "active");
            card.dataset.state = "open";
            openedCount++;
            countEl.textContent = openedCount;
            soundOpen.currentTime = 0;
            soundOpen.play().catch(() => {});
          } else if (card.dataset.state === "open") {
            card.classList.remove("open", "active");
            card.classList.add("done");
            card.dataset.state = "done";

            soundDone.currentTime = 0;
            soundDone.play().catch(() => {});
          }
        });

        container.appendChild(card);
      });

      resizeGrid();
    }

    function resizeGrid() {
      const width = window.innerWidth;
      const height = window.innerHeight * 0.8;
      let bestCols = 1;
      let bestRows = 1;
      let maxSize = 0;

      for (let cols = 1; cols <= totalCards; cols++) {
        const rows = Math.ceil(totalCards / cols);
        const cardWidth = width / cols;
        const cardHeight = height / rows;
        const size = Math.min(cardWidth, cardHeight);
        if (size > maxSize) {
          maxSize = size;
          bestCols = cols;
          bestRows = rows;
        }
      }

      container.style.gridTemplateColumns = `repeat(${bestCols}, 1fr)`;
      container.style.gridTemplateRows = `repeat(${bestRows}, 1fr)`;
    }

    window.addEventListener("resize", resizeGrid);
    restartBtn.addEventListener("click", createGame);
    createGame();
  </script>
