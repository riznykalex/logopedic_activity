<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>Вибір гри</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f0f0f0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .container {
      display: flex;
      gap: 40px;
    }
    .card {
      width: 250px;
      text-align: center;
      background: #fff;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      transition: transform 0.2s, box-shadow 0.2s;
      cursor: pointer;
      text-decoration: none;
      color: inherit;
    }
    .card img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      transition: transform 0.3s, filter 0.3s;
    }
    .card h3 {
      margin: 16px;
    }
    .card:hover {
      transform: scale(1.05);
      box-shadow: 0 8px 12px rgba(0,0,0,0.2);
    }
    .card:hover img {
      filter: brightness(85%);
      transform: scale(1.05);
    }
    .card:active {
      transform: scale(0.97);
    }
  </style>
</head>
<body>
  <div class="container">
    <a href="paw-patrol/index.html" class="card">
      <img src="https://cdn.prod.website-files.com/63f8f02e35d18441043c9041/6480cfcfb9e10cf1a8d0dc5e_chase-poster-p-800.jpg" alt="Щенячий патруль">
      <h3>Щенячий патруль</h3>
    </a>
    <a href="fixiki/index.html" class="card">
      <img src="fixiki\images\07.png" alt="Фіксіки">
      <h3>Фіксіки</h3>
    </a>
  </div>
</body>
</html>
